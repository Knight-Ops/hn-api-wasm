name: Publish Wasm to GHCR

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Wasm
        env:
          CARGO_REGISTRIES_BASILISKLABS_INDEX: "sparse+https://kellnr.basilisklabs.com/api/v1/crates/"
          CARGO_REGISTRIES_BASILISKLABS_CREDENTIAL_PROVIDER: "cargo:token"
          CARGO_REGISTRIES_BASILISKLABS_TOKEN: ${{ secrets.KELLNR }}
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Resolve Wasm artifact path
        id: wasm
        run: |
          eval "$(python - <<'PY'
          from pathlib import Path
          import tomllib

          with Path("Cargo.toml").open("rb") as cargo_toml:
              cargo = tomllib.load(cargo_toml)

          package = cargo["package"]
          package_name = package["name"]
          package_description = package.get("description", package_name)
          target_name = cargo.get("lib", {}).get("name") or package_name

          def shell_quote(value: str) -> str:
              return "'" + value.replace("'", "'\"'\"'") + "'"

          print(f'PACKAGE_NAME={shell_quote(package_name)}')
          print(f'PACKAGE_DESCRIPTION={shell_quote(package_description)}')
          print(f'WASM_FILE={shell_quote(target_name.replace("-", "_") + ".wasm")}')
          PY
          )"

          echo "path=target/wasm32-unknown-unknown/release/$WASM_FILE" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_description=$PACKAGE_DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Push Wasm to GHCR
        run: |
          WASM_PATH="${{ steps.wasm.outputs.path }}"
          
          # Convert image name to lowercase for OCI compliance
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Install toml parser (just in case, though we are using forge.yaml)
          pip install toml --user || true
          
          # Get tools as JSON array using yq
          TOOLS_JSON=$(yq -o json '.tools' forge.yaml 2>/dev/null || yq '.tools' forge.yaml)
          
          # Iterate over tools
          echo "$TOOLS_JSON" | jq -c '.[]' | while read -r tool; do
            NAME=$(echo "$tool" | jq -r '.name')
            DESC=$(echo "$tool" | jq -r '.description')
            ENTRY=$(echo "$tool" | jq -r '.entrypoint')
            
            # Iterate over tags generated by metadata-action (one per line)
            echo "${{ steps.meta.outputs.tags }}" | while read -r base_tag; do
              if [ -z "$base_tag" ]; then continue; fi
              
              # Extract the ref (branch or tag) after the last colon
              REF=${base_tag##*:}
              
              # Construct final tag: registry/repo:name-ref
              FINAL_TAG="${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${NAME}-${REF}"
              
              echo "Pushing tool $NAME to $FINAL_TAG..."
              oras push "$FINAL_TAG" \
                --artifact-type application/vnd.wasm.content.v1+wasm \
                --annotation "org.opencontainers.image.description=$DESC" \
                --annotation "module.wasm.entrypoint=$ENTRY" \
                "$WASM_PATH"
            done
          done

      - name: Push Manifest to GHCR
        run: |
          WASM_PATH="${{ steps.wasm.outputs.path }}"
          PACKAGE_NAME="${{ steps.wasm.outputs.package_name }}"
          PACKAGE_DESCRIPTION="${{ steps.wasm.outputs.package_description }}"
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Iterate over tags generated by metadata-action
          echo "${{ steps.meta.outputs.tags }}" | while read -r base_tag; do
            if [ -z "$base_tag" ]; then continue; fi
            REF=${base_tag##*:}
            
            FINAL_TAG="${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${REF}"
            echo "Pushing bundle to $FINAL_TAG..."
            oras push "$FINAL_TAG" \
              --artifact-type application/vnd.wasm-forge.v1+wasm \
              --annotation "org.opencontainers.image.title=$PACKAGE_NAME" \
              --annotation "org.opencontainers.image.description=$PACKAGE_DESCRIPTION" \
              "$WASM_PATH":application/vnd.wasm.content.v1+wasm \
              "forge.yaml":application/vnd.wasm-forge.manifest.v1+yaml \
              "extism-manifest.json":application/vnd.extism.manifest.v1+json
          done
